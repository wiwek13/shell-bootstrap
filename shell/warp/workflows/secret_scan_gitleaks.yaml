---
name: Scan repository for secrets with Gitleaks
command: gitleaks detect --source {{source_path}} --verbose --redact
description: Scan git commits, history, and uncommitted files for exposed secrets, API tokens, and keys
tags:
  - security
  - gitleaks
  - secrets
  - audit
shells:
  - zsh
  - bash
arguments:
  - name: source_path
    description: Root repository directory to scan
    default_value: .
