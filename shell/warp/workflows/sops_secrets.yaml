---
name: Edit or decrypt secrets with SOPS
command: sops {{action}} {{secret_file}}
description: Securely edit, encrypt, or decrypt files managed by Mozilla SOPS and age
tags:
  - security
  - sops
  - secrets
  - gitops
shells:
  - zsh
  - bash
arguments:
  - name: action
    description: SOPS command flag (empty to edit, -d to decrypt, -e to encrypt)
    default_value: ""
  - name: secret_file
    description: Path to secret file (e.g. secrets.enc.yaml)
    default_value: secrets.enc.yaml
