# Starship Configuration - Ultra DevOps & SRE Icon Theme
add_newline = true
command_timeout = 1000

format = """
$os\
$username\
$hostname\
$localip\
$shlvl\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$fill\
$kubernetes\
$aws\
$gcloud\
$azure\
$terraform\
$helm\
$docker_context\
$python\
$nodejs\
$golang\
$rust\
$java\
$bun\
$jobs\
$cmd_duration\
$battery\
$line_break\
$sudo\
$status\
$character"""

[character]
success_symbol = "[❯](bold #10b981)"
error_symbol = "[❯](bold #ef4444)"
vimcmd_symbol = "[❮](bold #38bdf8)"
vimcmd_replace_one_symbol = "[❮](bold #f59e0b)"
vimcmd_replace_symbol = "[❮](bold #f59e0b)"
vimcmd_visual_symbol = "[❮](bold #a855f7)"

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold white"

[os.symbols]
Macos = "  "
Linux = "🐧 "
Ubuntu = "  "
Debian = "  "
Arch = "󰣇 "
Fedora = "  "
Redhat = "󱄛 "
Windows = "󰍲 "

[username]
show_always = false
format = "[$user]($style)@"
style_user = "bold #38bdf8"
style_root = "bold #ef4444"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold #818cf8"

[localip]
ssh_only = true
format = "[$localipv4]($style) "
style = "dimmed white"

[directory]
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
style = "bold #38bdf8"
home_symbol = "󰋜 ~"
read_only = " 󰌾"
read_only_style = "bold #ef4444"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "󰇚 Downloads"
"Projects" = "󰲋 Projects"
"shell-bootstrap" = "󰒋 shell-bootstrap"
".config" = "⚙️ .config"

[fill]
symbol = " "

[git_branch]
symbol = "󰊢 "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold #c084fc"
truncation_length = 32
truncation_symbol = "…"

[git_commit]
commit_hash_length = 7
format = '[\($hash$tag\)]($style) '
style = "dimmed #c084fc"
only_detached = true
tag_symbol = " 🏷️ "

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold #f59e0b"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold #facc15"
conflicted = "󰞇 ${count} "
ahead = "󰁝 ${count} "
behind = "󰁅 ${count} "
diverged = "󰹹 󰁝 ${ahead_count} 󰁅 ${behind_count} "
untracked = "󰋗 ${count} "
stashed = "󰆓 ${count} "
modified = "󰛿 ${count} "
staged = "󰐖 ${count} "
renamed = "󰑕 ${count} "
deleted = "󰆴 ${count} "

[git_metrics]
disabled = false
added_style = "bold #22c55e"
deleted_style = "bold #ef4444"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[kubernetes]
disabled = false
format = '[$symbol$context(\($namespace\))]($style) '
symbol = "󱃾 ⎈ "
style = "bold #06b6d4"
detect_folders = []
detect_files = []

[kubernetes.context_aliases]
"arn:aws:eks:(?P<region>[\\w-]+):(?P<account>\\d+):cluster/(?P<cluster>[\\w-]+)" = "eks:$cluster"
"gke_(?P<project>[\\w-]+)_(?P<zone>[\\w-]+)_(?P<cluster>[\\w-]+)" = "gke:$cluster"

[aws]
disabled = false
format = '[$symbol($profile)(\($region\))]($style) '
symbol = "󰸏 "
style = "bold #f97316"

[aws.region_aliases]
us-east-1 = "use1"
us-east-2 = "use2"
us-west-1 = "usw1"
us-west-2 = "usw2"
eu-west-1 = "euw1"
eu-west-2 = "euw2"
eu-central-1 = "euc1"
ap-southeast-1 = "apse1"
ap-southeast-2 = "apse2"
ap-south-1 = "aps1"

[gcloud]
disabled = false
format = '[$symbol$account(@$project)(\($region\))]($style) '
symbol = "󱇶 "
style = "bold #4285F4"

[gcloud.region_aliases]
us-central1 = "usc1"
us-east1 = "use1"
us-west1 = "usw1"
europe-west1 = "euw1"
asia-south1 = "as1"

[azure]
disabled = false
format = '[$symbol($subscription)]($style) '
symbol = "󰠅 "
style = "bold #0284c7"

[terraform]
disabled = false
format = '[$symbol$workspace]($style) '
symbol = "󱁢 "
style = "bold #a855f7"

[helm]
disabled = false
format = '[$symbol($version)]($style) '
symbol = "󰠳 "
style = "bold #3b82f6"

[docker_context]
disabled = false
format = '[$symbol$context]($style) '
symbol = "󰡨 "
style = "bold #0ea5e9"
only_with_files = true

[python]
disabled = false
format = '[$symbol($version)(\($virtualenv\))]($style) '
symbol = "󰌠 "
style = "bold #eab308"
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", ".python-version"]

[nodejs]
disabled = false
format = '[$symbol($version)]($style) '
symbol = "󰌞 "
style = "bold #22c55e"
detect_extensions = ["js", "ts", "mjs", "cjs"]
detect_files = ["package.json", ".nvmrc"]

[golang]
disabled = false
format = '[$symbol($version)]($style) '
symbol = "󰟓 "
style = "bold #06b6d4"

[rust]
disabled = false
format = '[$symbol($version)]($style) '
symbol = "󱘗 "
style = "bold #ea580c"

[java]
disabled = false
format = '[$symbol($version)]($style) '
symbol = "󰬬 "
style = "bold #f97316"

[bun]
disabled = false
format = '[$symbol($version)]($style) '
symbol = "󰡄 "
style = "bold #fde047"

[cmd_duration]
min_time = 2000
format = "[󰔚 $duration]($style) "
style = "bold #eab308"
show_milliseconds = false
show_notifications = false

[time]
disabled = true
format = '[$symbol$time]($style) '
symbol = "󰥔 "
style = "bold #64748b"
time_format = "%H:%M"

[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = "✘ "
style = "bold #ef4444"

[sudo]
disabled = false
symbol = "󰌋 "
format = "[$symbol]($style)"
style = "bold #f59e0b"

[jobs]
disabled = false
format = "[$symbol$number]($style) "
symbol = "󰒲 "
style = "bold #60a5fa"
threshold = 1

[battery]
disabled = false
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 20
style = "bold #ef4444"

[[battery.display]]
threshold = 50
style = "bold #f59e0b"

[shlvl]
disabled = true
format = "[$symbol$shlvl]($style) "
symbol = "󰘍 "
style = "bold #a855f7"
threshold = 3
